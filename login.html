<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  Gym Owner Login · GYMOS
</title>


<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}


body {

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #1a1a2e 0%,
      #16213e 50%,
      #0f3460 100%
    );

  min-height: 100vh;

  display: flex;

  align-items: center;

  justify-content: center;

  color: #1a1a2e;

}


.auth-screen {

  width: 100%;

  padding: 24px;

}


.auth-card {

  max-width: 420px;

  margin: 0 auto;

  background: #fff;

  border-radius: 16px;

  padding: 32px 28px;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,0.35);

}


.auth-brand {

  font-size: 1.5rem;

  font-weight: 700;

  text-align: center;

  margin-bottom: 8px;

  letter-spacing: -0.02em;

}


.auth-title {

  font-size: 1.35rem;

  font-weight: 700;

  text-align: center;

  margin-bottom: 4px;

}


.auth-sub {

  text-align: center;

  color: #666;

  font-size: 0.9rem;

  margin-bottom: 24px;

}


.auth-error {

  background: #fee2e2;

  color: #b91c1c;

  border-radius: 8px;

  padding: 10px 14px;

  font-size: 0.875rem;

  margin-bottom: 16px;

  display: none;

}


.auth-error.show {

  display: block;

}


.form-group {

  margin-bottom: 16px;

}


.form-group label {

  display: block;

  font-size: 0.8rem;

  font-weight: 600;

  color: #374151;

  margin-bottom: 6px;

}


.form-group input[type="email"],
.form-group input[type="password"],
.form-group input[type="text"] {

  width: 100%;

  padding: 12px 14px;

  border:
    1.5px solid #e5e7eb;

  border-radius: 10px;

  font-size: 0.95rem;

  outline: none;

  transition:
    border-color 0.15s;

}


.form-group input:focus {

  border-color: #7c3aed;

  box-shadow:
    0 0 0 3px
    rgba(
      124,
      58,
      237,
      0.15
    );

}


.pw-wrap {

  position: relative;

}


.pw-wrap input {

  padding-right: 44px;

}


.pw-toggle {

  position: absolute;

  right: 10px;

  top: 50%;

  transform:
    translateY(-50%);

  background: none;

  border: none;

  cursor: pointer;

  font-size: 1.1rem;

  opacity: 0.6;

  padding: 4px;

}


.pw-toggle:hover {

  opacity: 1;

}


.captcha-row {

  display: flex;

  align-items: center;

  gap: 10px;

  margin-bottom: 8px;

}


#captcha {

  border-radius: 8px;

  background:
    linear-gradient(
      135deg,
      #f0f4ff 0%,
      #e8f0fe 100%
    );

  border:
    1.5px solid #d1d5db;

  display: block;

}


.captcha-refresh {

  flex-shrink: 0;

  width: 40px;

  height: 40px;

  border-radius: 8px;

  border:
    1.5px solid #d1d5db;

  background: #fff;

  cursor: pointer;

  font-size: 1rem;

}


.captcha-refresh:hover {

  background: #f3f4f6;

}


.btn {

  display: inline-flex;

  align-items: center;

  justify-content: center;

  border: none;

  border-radius: 10px;

  font-size: 0.95rem;

  font-weight: 600;

  cursor: pointer;

  transition:
    transform 0.1s,
    box-shadow 0.15s,
    opacity 0.15s;

}


.btn:disabled {

  opacity: 0.6;

  cursor: not-allowed;

}


.btn:active {

  transform:
    scale(0.98);

}


.btn-primary {

  background:
    linear-gradient(
      90deg,
      #7c3aed,
      #db2777
    );

  color: #fff;

  padding: 14px 20px;

}


.btn-primary:hover {

  box-shadow:
    0 6px 20px
    rgba(
      124,
      58,
      237,
      0.4
    );

}


.btn-block {

  width: 100%;

}


.auth-footer {

  margin-top: 16px;

  text-align: center;

  font-size: 0.75rem;

  color: #9ca3af;

  line-height: 1.4;

}

</style>

</head>


<body>


<div class="auth-screen">

  <div class="auth-card">


    <div class="auth-brand">
      🏋️ GYMOS
    </div>


    <h1 class="auth-title">
      Gym Owner Login
    </h1>


    <p class="auth-sub">
      Sign in to manage your gym
    </p>


    <div
      class="auth-error"
      id="err"
    ></div>


    <form
      id="login-form"
    >


      <div class="form-group">

        <label>
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          required
          autocomplete="username"
        >

      </div>


      <div class="form-group">

        <label>
          Password
        </label>


        <div class="pw-wrap">

          <input
            type="password"
            id="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >


          <button
            type="button"
            class="pw-toggle"
            id="pw-toggle"
            aria-label="Show password"
          >
            👁
          </button>

        </div>

      </div>


      <div class="form-group">

        <label>
          Security Check
        </label>


        <div class="captcha-row">

          <canvas
            id="captcha"
            width="180"
            height="52"
            aria-label="CAPTCHA image"
          ></canvas>


          <button
            type="button"
            class="captcha-refresh"
            id="captcha-refresh"
            title="Refresh code"
          >
            ↻
          </button>

        </div>


        <input
          type="text"
          id="captcha-input"
          placeholder="Enter the code above (case sensitive)"
          required
          autocomplete="off"
          maxlength="6"
          spellcheck="false"
        >

      </div>


      <button
        type="submit"
        class="btn btn-primary btn-block"
        id="submit-btn"
      >
        Verify &amp; Continue →
      </button>


    </form>


    <div class="auth-footer">

      GymOS is a multi-tenant system —
      every gym's data stays isolated
      to its own account.

    </div>


  </div>

</div>


<!-- =========================================================
     SCRIPT ORDER IS IMPORTANT
     ========================================================= -->

<script src="js/api.js"></script>

<script src="js/auth.js"></script>

<script src="js/login.js"></script>


</body>

</html>
